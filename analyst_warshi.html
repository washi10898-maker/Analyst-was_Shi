<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyst War_Shi PRO</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1a1a1a;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        h1 {
            margin: 0;
            font-size: 2rem;
        }
        section {
            padding: 20px;
            max-width: 600px;
            margin: auto;
            background: #fff;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        button {
            background-color: #007aff;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
        }
        button:hover {
            background-color: #005bb5;
        }
        .subscription-plan {
            margin: 10px 0;
        }
        .signal {
            background-color: #e9f5ff;
            padding: 10px;
            margin: 10px 0;
            border-left: 4px solid #007aff;
        }
        nav a {
            display: inline-block;
            margin: 5px 10px;
            text-decoration: none;
            color: #007aff;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <h1>Analyst War_Shi PRO</h1>
</header>

<section>
    <h2>Member Login</h2>
    <input type="text" placeholder="Username" style="width:100%; padding:8px; margin:5px 0;">
    <input type="password" placeholder="Password" style="width:100%; padding:8px; margin:5px 0;">
    <button>Login</button>
</section>

<section>
    <h2>💰 Subscribe via M-Pesa</h2>
    <div class="subscription-plan">Daily - 20 KES <button>Pay Now</button></div>
    <div class="subscription-plan">Weekly - 120 KES <button>Pay Now</button></div>
    <div class="subscription-plan">Monthly - 500 KES <button>Pay Now</button></div>
</section>

<section>
    <h2>📊 Live Signals</h2>
    <div class="signal">Signal 1: Buy USD/JPY at 145.20</div>
    <div class="signal">Signal 2: Sell EUR/USD at 1.0830</div>
    <button>Logout</button>
</section>

<section>
    <h2>⚙️ Admin Panel</h2>
    <button>Post Signal</button>
</section>

</body>
</html>
